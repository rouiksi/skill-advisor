openapi: 3.1.0
info:
  title: Skill Advisor Index
  version: "1.0"
servers:
  - url: https://raw.githubusercontent.com/OWNER/skill-advisor/main
paths:
  /index/index.json:
    get:
      operationId: getSkillIndex
      summary: Catalogo aggiornato delle skill ufficiali (solo ultime versioni)
      responses:
        "200":
          description: Indice skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: { type: string }
                  count: { type: integer }
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        keywords: { type: array, items: { type: string } }
                        url: { type: string }
                        platforms: { type: array, items: { type: string } }
